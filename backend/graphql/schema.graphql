scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    me: User
        @auth(guard: "sanctum")

    minhasViagens: [Viagem!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@minhasViagens")

    viagem(id: ID!): Viagem
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@viagem")

    destinos: [Destino!]!
        @guard(with: ["sanctum"])
        @all(model: "App\\Models\\Destino")

    destino(id: ID! @eq): Destino
        @guard(with: ["sanctum"])
        @find(model: "App\\Models\\Destino")

    meusFavoritos: [Favorito!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@meusFavoritos")
}

type Mutation {
    criarDestino(
        nome: String!
        estado: String
        pais: String!
        codigo_pais: String
        latitude: Float
        longitude: Float
        moeda: String
        osm_id: String
        osm_type: String
    ): Destino!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@criarDestino")

    criarViagem(
        titulo: String!
        descricao: String
        data_inicio: Date!
        data_fim: Date!
        status: String!
    ): Viagem!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@criarViagem")

    atualizarViagem(
        id: ID!
        titulo: String
        descricao: String
        data_inicio: Date
        data_fim: Date
        status: String
    ): Viagem!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@atualizarViagem")

    excluirViagem(id: ID!): Boolean!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@excluirViagem")

    adicionarFavorito(destino_id: ID!): Favorito!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@adicionarFavorito")

    removerFavorito(destino_id: ID!): Boolean!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@removerFavorito")

    adicionarDestinoViagem(
        viagem_id: ID!
        destino_id: ID!
        ordem: Int!
        data_chegada: Date
        data_saida: Date
        observacoes: String
    ): ViagemDestino!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@adicionarDestinoViagem")

    atualizarDestinoViagem(
        id: ID!
        ordem: Int
        data_chegada: Date
        data_saida: Date
        observacoes: String
    ): ViagemDestino!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@atualizarDestinoViagem")

    removerDestinoViagem(id: ID!): Boolean!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Api@removerDestinoViagem")
}

type User {
    id: ID!
    name: String!
    email: String!
}

type Viagem {
    id: ID!
    usuario_id: ID!
    titulo: String!
    descricao: String
    data_inicio: Date!
    data_fim: Date!
    status: String!
    created_at: DateTime
    updated_at: DateTime

    destinos: [Destino!]!
        @belongsToMany

    viagemDestinos: [ViagemDestino!]!
        @hasMany
}

type Destino {
    id: ID!
    nome: String!
    estado: String
    pais: String!
    codigo_pais: String
    latitude: Float
    longitude: Float
    moeda: String
    osm_id: String
    osm_type: String
    created_at: DateTime
}

type Favorito {
    id: ID!
    destino_id: ID!
    created_at: DateTime

    destino: Destino!
        @belongsTo
}

type ViagemDestino {
    id: ID!
    viagem_id: ID!
    destino_id: ID!
    ordem: Int!
    data_chegada: Date
    data_saida: Date
    observacoes: String

    destino: Destino!
        @belongsTo
}
